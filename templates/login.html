<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Escape Room - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=1">
</head>
<body>
    <div class="game-container">
        <h2>Identify Yourself</h2>
        <p class="story">Prove your identity to resume your escape attempt.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="flash {{ category }}" style="margin-bottom: 15px;">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST" autocomplete="off">
            <!-- Trick the browser's autofill engine with hidden dummy fields -->
            <input type="text" style="display:none;" autocomplete="false">
            <input type="password" style="display:none;" autocomplete="false">

            <input type="text" name="identifier" placeholder="Username or Email" required autocomplete="new-username" value="">
            <input type="password" name="password" placeholder="Password" required autocomplete="new-password" value="">
            
            <button type="submit">Enter the Rooms</button>
        </form>

        <hr style="border-color: #1f2833; margin: 20px 0;">
        <p style="font-size: 0.9em;">
            New sacrifice? <a href="{{ url_for('signup') }}" style="color: #66fcf1; text-decoration: none; font-weight: bold;">Create an Account</a>
        </p>
    </div>
</body>
</html>
